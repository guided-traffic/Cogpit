# Several versions (synthetic): v1alpha1 is the storage version, v1 is not served, so the view
# uses v1beta1 and its printer columns.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.example.io
spec:
  group: example.io
  names:
    kind: Backup
    plural: backups
    singular: backup
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
  - name: v1beta1
    served: true
    storage: false
    additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.size
      name: Size
      type: integer
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
      priority: 1
  - name: v1
    served: false
    storage: false
    additionalPrinterColumns:
    - jsonPath: .status.phase
      name: State
      type: string
status:
  conditions:
  - type: Established
    status: "True"
