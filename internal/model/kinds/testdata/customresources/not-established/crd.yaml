# A definition the API server does not serve (synthetic): its names are not accepted, so it is
# not established and Cogpit offers no view for it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.shop.example.com
spec:
  group: shop.example.com
  names:
    kind: Widget
    plural: widgets
    singular: widget
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
status:
  conditions:
  - type: NamesAccepted
    status: "False"
    reason: ShortNamesConflict
  - type: Established
    status: "False"
    reason: NotAccepted
