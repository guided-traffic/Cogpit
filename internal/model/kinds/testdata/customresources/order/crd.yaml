# A cert-manager-like Order definition (synthetic). Lens shows its view with Name, Namespace,
# State, Age (capture, 2026-10-11): Issuer and Reason have priority 1.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: orders.acme.cert-manager.io
spec:
  group: acme.cert-manager.io
  names:
    kind: Order
    plural: orders
    singular: order
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.issuerRef.name
      name: Issuer
      priority: 1
      type: string
    - jsonPath: .status.reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
status:
  conditions:
  - type: Established
    status: "True"
