# A Gateway API Gateway definition (synthetic, after the Gateway API's printer columns): two
# served versions; the view uses v1.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gateways.gateway.networking.k8s.io
spec:
  group: gateway.networking.k8s.io
  names:
    kind: Gateway
    listKind: GatewayList
    plural: gateways
    shortNames: [gtw]
    singular: gateway
  scope: Namespaced
  versions:
  - name: v1beta1
    served: true
    storage: false
    additionalPrinterColumns:
    - jsonPath: .spec.gatewayClassName
      name: Class
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - jsonPath: .spec.gatewayClassName
      name: Class
      type: string
    - jsonPath: .status.addresses[*].value
      name: Address
      type: string
    - jsonPath: .status.conditions[?(@.type=="Programmed")].status
      name: Programmed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
status:
  conditions:
  - type: NamesAccepted
    status: "True"
  - type: Established
    status: "True"
