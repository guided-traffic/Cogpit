# Synthetic: an Ingress a controller has admitted: two hosts, TLS, a default backend, and the
# address the controller published.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: shop
  uid: 6a1b2c3d-5555-4a6b-9c7d-000000000001
  creationTimestamp: "2026-10-01T00:00:00Z"
  labels:
    app: storefront
spec:
  ingressClassName: nginx
  defaultBackend:
    service:
      name: web
      port:
        name: http
  tls:
  - hosts:
    - shop.example.com
    - www.shop.example.com
    secretName: shop-tls
  rules:
  - host: shop.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80
  - host: www.shop.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              name: http
status:
  loadBalancer:
    ingress:
    - ip: 203.0.113.30
