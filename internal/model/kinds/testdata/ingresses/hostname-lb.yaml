# Synthetic: a cloud load balancer known by its hostname, with the ports it reports and an error
# on one; a wildcard host whose ImplementationSpecific path has no path, a rule without a host,
# and a host-only rule without paths (the default backend would serve it; there is none).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tenants
  namespace: saas
  uid: 6a1b2c3d-5555-4a6b-9c7d-000000000006
  creationTimestamp: "2026-09-11T12:00:00Z"
spec:
  ingressClassName: alb
  rules:
  - host: "*.tenants.example.com"
    http:
      paths:
      - pathType: ImplementationSpecific
        backend:
          service:
            name: tenant-router
            port:
              number: 8443
  - http:
      paths:
      - path: /healthz
        pathType: Exact
        backend:
          service:
            name: health
            port:
              number: 8080
  - host: parked.example.com
status:
  loadBalancer:
    ingress:
    - hostname: k8s-saas-tenants-0123456789.elb.example.net
      ports:
      - port: 80
        protocol: TCP
      - port: 443
        protocol: TCP
        error: |
          CertificateNotFound: no certificate
          for *.tenants.example.com
