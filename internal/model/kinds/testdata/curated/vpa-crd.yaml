# Synthetic: a VerticalPodAutoscaler definition with the autoscaler's group, names and versions
# (v1 served and stored, v1beta2 served), its printer columns, and no schema beyond what a
# definition needs.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: verticalpodautoscalers.autoscaling.k8s.io
spec:
  group: autoscaling.k8s.io
  names:
    kind: VerticalPodAutoscaler
    listKind: VerticalPodAutoscalerList
    plural: verticalpodautoscalers
    shortNames: [vpa]
    singular: verticalpodautoscaler
  scope: Namespaced
  versions:
  - name: v1beta2
    served: true
    storage: false
  - name: v1
    served: true
    storage: true
    additionalPrinterColumns:
    - jsonPath: .spec.updatePolicy.updateMode
      name: Mode
      type: string
    - jsonPath: .status.recommendation.containerRecommendations[0].target.cpu
      name: CPU
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
status:
  conditions:
  - type: Established
    status: "True"
