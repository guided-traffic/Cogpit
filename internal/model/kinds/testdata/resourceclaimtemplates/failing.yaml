# Synthetic: a template whose requests name the same class twice, one with alternatives; a
# template has no state, so "failing" shows what a busy template looks like.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: gpu-and-nic
  namespace: media
  uid: 8d2e3f40-0001-4b6c-9d7e-000000000002
  creationTimestamp: "2026-10-11T11:00:00Z"
spec:
  spec:
    devices:
      requests:
      - name: gpu
        firstAvailable:
        - name: large
          deviceClassName: gpu-large.example.com
        - name: small
          deviceClassName: gpu.example.com
          count: 2
      - name: spare
        exactly:
          deviceClassName: gpu.example.com
      - name: nic
        exactly:
          deviceClassName: nic.example.net
          allocationMode: All
