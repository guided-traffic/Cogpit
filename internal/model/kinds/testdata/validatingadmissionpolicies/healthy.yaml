kind: ValidatingAdmissionPolicy
metadata:
  name: replica-limit
  uid: 86d74859-3333-4081-92a3-000000000001
  creationTimestamp: "2026-09-01T00:00:00Z"
  generation: 2
  labels:
    app.kubernetes.io/part-of: guardrails
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
    matchPolicy: Equivalent
    namespaceSelector:
      matchLabels:
        environment: production
  matchConditions:
  - name: not-a-system-user
    expression: '!request.userInfo.username.startsWith("system:")'
  variables:
  - name: maxReplicas
    expression: int(params.data.maxReplicas)
  validations:
  - expression: object.spec.replicas <= variables.maxReplicas
    messageExpression: '"replicas must be at most " + string(variables.maxReplicas)'
    reason: Invalid
  - expression: has(object.spec.template.spec.priorityClassName)
    message: production deployments need a priority class
  auditAnnotations:
  - key: high-replica-count
    valueExpression: '"deployment " + object.metadata.name + " asks for " + string(object.spec.replicas)'
