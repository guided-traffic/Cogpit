# Synthetic: the job of the last schedule failed: nothing is active and the last success is older
# than the last schedule.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-prices
  namespace: shop
  uid: 8e5b9a1c-8888-4f6e-9a5b-000000000002
  generation: 1
  creationTimestamp: "2026-10-01T00:00:00Z"
spec:
  schedule: '*/15 * * * *'
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
