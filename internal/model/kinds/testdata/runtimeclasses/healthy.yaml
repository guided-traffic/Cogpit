# Synthetic: a sandboxed runtime with a pod overhead and a node selector and toleration for the
# nodes that run it.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  uid: 42930415-dddd-4c4d-5e6f-000000000001
  creationTimestamp: "2026-07-01T00:00:00Z"
  labels:
    app.kubernetes.io/managed-by: platform
handler: runsc
overhead:
  podFixed:
    cpu: 250m
    memory: 120Mi
scheduling:
  nodeSelector:
    sandbox.example.com/runtime: gvisor
  tolerations:
  - key: sandbox.example.com/runtime
    operator: Equal
    value: gvisor
    effect: NoSchedule
