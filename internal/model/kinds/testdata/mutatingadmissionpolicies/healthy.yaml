# Synthetic: a policy that adds a sidecar with an apply configuration and labels the pod with a JSON
# patch, called again when another mutation changed the pod.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: inject-log-shipper
  uid: a8f96a71-5555-42a3-b4c5-000000000001
  creationTimestamp: "2026-09-01T00:00:00Z"
  labels:
    app.kubernetes.io/part-of: logging
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - v1
      operations:
      - CREATE
      resources:
      - pods
    matchPolicy: Equivalent
  matchConditions:
  - name: opted-in
    expression: object.metadata.?labels["logging.example.com/ship"].orValue("") == "true"
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: >-
        Object{spec: Object.spec{initContainers: [Object.spec.initContainers{name: "log-shipper",
        image: "registry.example.com/logging/shipper:3.2", restartPolicy: "Always"}]}}
  - patchType: JSONPatch
    jsonPatch:
      expression: '[JSONPatch{op: "add", path: "/metadata/labels/logging.example.com~1injected", value: "true"}]'
