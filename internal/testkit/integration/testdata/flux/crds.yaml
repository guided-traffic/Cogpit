# Minimal, hand-written definitions of three Flux toolkit kinds for TestKindFlux: the groups,
# versions, kinds and scopes Flux v2 serves, a schema that keeps any field, and the status
# subresource, as Flux's own definitions have it. Not Flux's definitions (no download, no
# controllers): the test writes the status a controller would.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kustomizations.kustomize.toolkit.fluxcd.io
spec:
  group: kustomize.toolkit.fluxcd.io
  scope: Namespaced
  names:
    plural: kustomizations
    singular: kustomization
    kind: Kustomization
    listKind: KustomizationList
    shortNames: [ks]
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gitrepositories.source.toolkit.fluxcd.io
spec:
  group: source.toolkit.fluxcd.io
  scope: Namespaced
  names:
    plural: gitrepositories
    singular: gitrepository
    kind: GitRepository
    listKind: GitRepositoryList
    shortNames: [gitrepo]
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmreleases.helm.toolkit.fluxcd.io
spec:
  group: helm.toolkit.fluxcd.io
  scope: Namespaced
  names:
    plural: helmreleases
    singular: helmrelease
    kind: HelmRelease
    listKind: HelmReleaseList
    shortNames: [hr]
  versions:
  - name: v2
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
