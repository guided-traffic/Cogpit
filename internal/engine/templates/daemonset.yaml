apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: example-agent
spec:
  selector:
    matchLabels:
      app: example-agent
  template:
    metadata:
      labels:
        app: example-agent
    spec:
      containers:
      - name: agent
        image: busybox:1.37
        command: ["sh", "-c", "while true; do sleep 3600; done"]
