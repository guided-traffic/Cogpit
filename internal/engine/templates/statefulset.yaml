apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: example-db
spec:
  serviceName: example-db
  replicas: 1
  selector:
    matchLabels:
      app: example-db
  template:
    metadata:
      labels:
        app: example-db
    spec:
      containers:
      - name: db
        image: busybox:1.37
        command: ["sh", "-c", "while true; do sleep 3600; done"]
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
