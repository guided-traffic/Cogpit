# Re-run on runner failures: a push run of "Test and Release" on main whose jobs failed only while
# setting up (GitHub refusing the actions' downloads with 429, an apt mirror hanging until the
# job's timeout) gets its failed jobs re-run once, so that semantic-release still releases main's
# newest commit. Without it a single runner hiccup in one of some twenty jobs skipped the release
# silently (2026-10-15: no release after 6ffd0ae, the last run green but for one shard stuck in
# apt-get). Only the run of main's newest commit (an older one is superseded anyway), only its
# first attempt, and only when every failed or cancelled job stopped in a set-up step: a failing
# test, lint or check is never re-run.
name: Re-run on runner failures

on:
  workflow_run:
    workflows: [Test and Release]
    types: [completed]
    branches: [main]

permissions:
  actions: write  # re-run the failed jobs

jobs:
  rerun:
    name: Re-run jobs that failed setting up
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
    # GitHub-hosted: independent of the shared self-hosted node whose hiccups it repairs, and it has gh.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the failed jobs if each stopped in its set-up
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
          if [ "${head}" != "${SHA}" ]; then
            echo "run ${RUN} is for ${SHA}, main is at ${head}: superseded, nothing to do"
            exit 0
          fi
          # Each failed or cancelled job with the first step it failed or was cancelled in.
          stops="$(gh api --paginate "repos/${REPO}/actions/runs/${RUN}/jobs" --jq '.jobs[]
            | select(.conclusion == "failure" or .conclusion == "cancelled")
            | .name + " :: " + ([.steps[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name][0] // "no step")')"
          if [ -z "${stops}" ]; then
            echo "no failed or cancelled job"
            exit 0
          fi
          echo "${stops}"
          if printf '%s\n' "${stops}" | sed 's/.* :: //' |
            grep -Evq '^(Set up job|Set up runner|Set up Go|Checkout.*|Install .*|Download the modules|Restore the build cache)$'; then
            echo "a job failed past its set-up: a real failure, not re-run"
            exit 0
          fi
          gh run rerun "${RUN}" --failed --repo "${REPO}"
          echo "re-ran the failed jobs of run ${RUN}"
