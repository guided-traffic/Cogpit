# Release Build: what a release holds. Semantic Release (release.yml) creates the tag and the GitHub
# release with the GitHub App's token once every gate on main is green; the release's "published"
# event starts this workflow, which builds the artifacts from the tag and attaches them to the
# release with SHA256SUMS. A release made with GITHUB_TOKEN would start no workflow, hence the App.
# What a release holds and what it does not (no signature, no notarization yet):
# docs/developer/releasing.md#the-release-pipeline, docs/security/updates.md.
name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # cogpit-cli is pure Go: every platform from one Linux runner (make dist-cli).
  cli:
    name: cogpit-cli (linux, darwin, windows)
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 15
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: release
          fyne-deps: "false"

      - name: Install zip
        run: command -v zip >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zip >/dev/null; }

      - name: Build the archives
        run: make dist-cli VERSION="${GITHUB_REF_NAME#v}"

      # The binary for this runner says the release's version.
      - name: Check the version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="$(dist/cli/cogpit-cli_${version}_linux_amd64/cogpit-cli --version)"
          echo "${out}"
          case "${out}" in "cogpit-cli ${version} "*) ;; *) echo "::error::cogpit-cli --version: ${out}"; exit 1 ;; esac

      - name: Upload the archives
        uses: actions/upload-artifact@v7
        with:
          name: release-cli
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7

  # The desktop app needs macOS: cgo with AppKit does not cross-compile from Linux (make dist-app).
  # Unsigned: ad-hoc signed by make app, no Developer ID, not notarized.
  macos-app:
    name: Cogpit.app (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: macos

      - name: Build and zip Cogpit.app
        run: make dist-app VERSION="${GITHUB_REF_NAME#v}"

      - name: Check the bundle
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          plutil -extract CFBundleShortVersionString raw bin/Cogpit.app/Contents/Info.plist | grep -qx "${version}"
          codesign --verify bin/Cogpit.app
          lipo -archs bin/Cogpit.app/Contents/MacOS/cogpit
          unzip -l "dist/Cogpit_${version}_darwin_arm64.zip" | tail -n 1

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/*.zip
          retention-days: 7

  publish:
    name: Attach to the release
    needs: [cli, macos-app]
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 15
    permissions:
      contents: write  # upload the assets, append the note to the release's text
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Install make
        run: command -v make >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq make >/dev/null; }

      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: make dist-checksums

      - name: Attach the artifacts and the note
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          append_body: true
          body: |

            ---

            **Downloads.** `cogpit-cli` for Linux, macOS and Windows (amd64 and arm64) and `Cogpit.app` for macOS on Apple silicon; check them against `SHA256SUMS` (`sha256sum -c SHA256SUMS --ignore-missing`).

            **Unsigned.** Neither the app nor the macOS `cogpit-cli` is signed with a Developer ID or notarized yet. macOS blocks the first start of a downloaded copy: allow it once in System Settings → Privacy & Security → Open Anyway. Signing and notarization come once the project's Apple credentials exist ([docs/security/updates.md](https://github.com/guided-traffic/cogpit/blob/main/docs/security/updates.md)). Desktop packages for Linux and Windows come with milestone M11; `cogpit-cli` runs there today.
