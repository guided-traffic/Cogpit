# Build: the checks every push to main and every pull request must pass.
#
# release.yml ("Test and Release") owns the triggers and calls this workflow, so each push runs
# these jobs once and the README's build badge (release.yml) reflects them. workflow_dispatch runs
# the checks alone. What each job proves: docs/developer/releasing.md#ci.
#
# Go comes from go.mod (go-version-file). setup-go installs that version, caches the module and
# build caches, and exports GOTOOLCHAIN=local; the Makefile exports GOTOOLCHAIN=auto, which finds
# the same version and downloads nothing.
name: Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The platform Cogpit ships first: the full gate, the same make targets as on a laptop.
  macos:
    name: "macOS: lint, race tests, build"
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod download

      - name: Lint (golangci-lint with the depguard layering)
        run: make lint

      - name: Parity checklists and the numbers they report (make parity, D-15)
        run: make parity

      # test-unit-race plus a coverage profile: the same packages and the same race detector.
      - name: Race tests with coverage
        run: make test-unit-coverage

      - name: Build cogpit (cgo, Fyne) and cogpit-cli (pure Go)
        run: make build

      - name: Coverage badge and summary
        run: |
          set -euo pipefail
          make coverage-badge
          profile=.cache/coverage/unit.out
          {
            echo "## Coverage: $(jq -r .message .github/badges/coverage.json)"
            echo
            echo "Each package counts the statements its own tests cover (no -coverpkg)."
            echo
            echo "| Package | Coverage | Statements |"
            echo "|---|---:|---:|"
            awk 'NR > 1 {
                   file = $1; sub(/:.*/, "", file); pkg = file; sub(/\/[^\/]*$/, "", pkg)
                   total[pkg] += $2; if ($3 > 0) covered[pkg] += $2
                 }
                 END {
                   for (p in total)
                     printf "| `%s` | %.1f%% | %d/%d |\n", p, total[p] ? 100 * covered[p] / total[p] : 0, covered[p], total[p]
                 }' "${profile}" | sort
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: .cache/coverage/unit.out
          retention-days: 7

      # release.yml commits this file to main when it changed (job "Coverage Badge").
      - name: Upload coverage badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: .github/badges/coverage.json
          retention-days: 7

  # Windows and Linux come after the macOS beta (D-7); until then CI proves that every package and
  # every test still compiles and links there with cgo and Fyne's native dependencies.
  compile:
    name: Compile (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Fail loudly when no C compiler is found instead of building without cgo.
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The packages Fyne 2.8 documents for Debian and Ubuntu: a C compiler, OpenGL, X11, xkbcommon.
      - name: Install Fyne's build dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols

      # Fyne on Windows needs a MinGW-w64 gcc for cgo; MSYS2 is the toolchain Fyne documents.
      - name: Install MinGW-w64 gcc (Windows)
        id: msys2
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Put MinGW-w64 gcc on PATH (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"

      - name: Toolchain
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED CC
          gcc --version | head -n 1

      - name: Install dependencies
        run: go mod download

      # Compiles every package and links the main packages (cmd/cogpit with Fyne's GL driver).
      - name: Build every package
        run: go build ./...

      - name: Vet every package and its tests
        run: go vet ./...

      # Builds and links every test binary (cgo link errors show here) and runs no test.
      - name: Compile and link the tests
        run: go test -count=1 -run '^$' ./...

  # Cluster tests against a real API server and kubelet: views, logs, exec, kubectl in the terminal.
  # make kind-up writes the cluster's kubeconfig to .cache/kind/kubeconfig; the job's KUBECONFIG
  # points there too, so nothing in this job reads or writes ~/.kube.
  kind:
    name: Cluster Tests (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KUBECONFIG: ${{ github.workspace }}/.cache/kind/kubeconfig
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # make test-kind compiles every package, the Fyne UI included.
      - name: Install Fyne's build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols

      - name: Install dependencies
        run: go mod download

      # install_only: the cluster comes from make kind-up (hack/kind/cluster.yaml). kind v0.33.0
      # defaults to Kubernetes 1.37.0; kubectl matches client-go v0.37.1.
      - name: Install kind and kubectl
        uses: helm/kind-action@v1.15.1
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          install_only: true
          ignore_failed_clean: true

      - name: Create the kind cluster and seed it
        run: make kind-up

      # kind-seed waits for web and api but does not fail on slow image pulls; the pod shell test
      # needs the toolbox pod running.
      - name: Wait for the seed
        run: |
          kubectl --context kind-cogpit -n cogpit-demo rollout status deployment/web --timeout=300s
          kubectl --context kind-cogpit -n cogpit-demo rollout status deployment/api --timeout=300s
          kubectl --context kind-cogpit -n cogpit-demo wait --for=condition=Ready pod/toolbox --timeout=300s

      - name: Cluster tests (race detector on)
        run: make test-kind

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-cogpit get nodes -o wide || true
          kubectl --context kind-cogpit get pods -A -o wide || true
          kubectl --context kind-cogpit -n cogpit-demo describe pods || true
          kubectl --context kind-cogpit -n cogpit-demo get events --sort-by=.lastTimestamp || true

      - name: Delete the kind cluster
        if: always()
        run: make kind-down || true

  # govulncheck reports known vulnerabilities only where Cogpit's code reaches the affected
  # symbol. Loading the packages runs cgo, hence Fyne's build dependencies.
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Fyne's build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols

      - name: Install dependencies
        run: go mod download

      - name: Run vulnerability check
        run: make vuln
