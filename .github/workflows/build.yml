# Release Build: what a release holds. Semantic Release (release.yml) creates the tag and the GitHub
# release with the GitHub App's token once every gate on main is green; the release's "published"
# event starts this workflow on the tag (github.ref is refs/tags/v<version>), which builds the
# artifacts, signs and notarizes the macOS ones, and attaches everything to the release with
# SHA256SUMS; then the release's item joins Sparkle's appcast, signed in the environment sparkle
# and deployed to GitHub Pages. A release made with GITHUB_TOKEN would start no workflow, hence
# the App.
# What a release holds and what vouches for it: docs/developer/releasing.md#the-release-pipeline,
# docs/security/updates.md.
name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The release builds start without a build cache: an artifact never comes from objects another run
# wrote, and saving the six platforms' cache took 5:18 minutes from the self-hosted runner (v0.1.0),
# longer than building them.

jobs:
  # cogpit-cli is pure Go: every platform from one Linux runner (make dist-cli).
  cli:
    name: cogpit-cli (linux, darwin, windows)
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 15
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: none
          fyne-deps: "false"

      - name: Install zip
        run: command -v zip >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zip >/dev/null; }

      - name: Build the archives
        run: make dist-cli VERSION="${GITHUB_REF_NAME#v}"

      # The binary for this runner says the release's version.
      - name: Check the version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="$("dist/cli/cogpit-cli_${version}_linux_amd64/cogpit-cli" --version)"
          echo "${out}"
          case "${out}" in "cogpit-cli ${version} "*) ;; *) echo "::error::cogpit-cli --version: ${out}"; exit 1 ;; esac

      - name: Upload the archives
        uses: actions/upload-artifact@v7
        with:
          name: release-cli
          path: |
            dist/cogpit-cli_*_linux_*.tar.gz
            dist/cogpit-cli_*_windows_*.zip
          if-no-files-found: error
          retention-days: 7

      # The macOS archives reach the release through the signing job (macos-sign).
      - name: Upload the macOS archives
        uses: actions/upload-artifact@v7
        with:
          name: cli-darwin
          path: dist/cogpit-cli_*_darwin_*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The desktop app needs macOS: cgo with AppKit does not cross-compile from Linux (make dist-app).
  # Signed ad-hoc here; the signing job signs it with the Developer ID. This job sees no secret.
  macos-app:
    name: Cogpit.app (macOS arm64)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: none

      # Sparkle (D-4) goes into the bundle with the update key's public half, a repository variable
      # (not a secret: every installed copy shows it); unset, the app has no updater.
      - name: Build and zip Cogpit.app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: make dist-app VERSION="${GITHUB_REF_NAME#v}"

      - name: Check the bundle
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          plist=bin/Cogpit.app/Contents/Info.plist
          plutil -extract CFBundleShortVersionString raw "${plist}" | grep -qx "${version}"
          plutil -extract CFBundleVersion raw "${plist}" | grep -qx "${version}"
          test -f bin/Cogpit.app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle
          key="$(plutil -extract SUPublicEDKey raw "${plist}" 2>/dev/null || true)"
          test "${key}" = "${SPARKLE_PUBLIC_ED_KEY}"
          echo "update key: ${key:-none (this release does not update itself)}"
          codesign --verify --strict --deep bin/Cogpit.app
          lipo -archs bin/Cogpit.app/Contents/MacOS/cogpit
          unzip -l "dist/Cogpit_${version}_darwin_arm64.zip" | tail -n 1

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: dist/Cogpit_*_darwin_*.zip
          if-no-files-found: error
          retention-days: 7

  # The app in the disk image Cogpit-<version>-macos-<arch>.dmg and cogpit-cli for macOS, signed
  # with the Developer ID (hardened runtime, Apple's timestamp), notarized, the disk image's ticket
  # stapled, and checked as Gatekeeper checks them (make dist-macos: hack/macos/release.sh).
  #
  # The only job in the environment `release`, whose secrets only a tag v* may use. It builds
  # nothing and runs no Go, so no dependency's code shares a job with the signing identity.
  # Without the secrets (a fork) the app zip and the archives pass through unsigned. With some of
  # them, or when a signature, the notarization or a check fails, the job fails and the release
  # gets no files until the failed jobs are re-run, never unsigned files under a signed note
  # (docs/developer/releasing.md#when-signing-or-notarization-fails).
  macos-sign:
    name: Sign and notarize (macOS)
    needs: [cli, macos-app]
    runs-on: macos-latest
    environment: release
    # Apple's notary service usually answers within minutes; the script waits 45 at most.
    timeout-minutes: 70
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
      identity: ${{ steps.sign.outputs.identity }}
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Download the app
        uses: actions/download-artifact@v8
        with:
          name: macos-app
          path: dist

      - name: Download the macOS archives
        uses: actions/download-artifact@v8
        with:
          name: cli-darwin
          path: dist

      - name: Sign, notarize and staple
        id: sign
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # Apple's intermediate for Developer ID certificates (G2, valid to 2031-09-17), pinned by
          # its SHA-256: the runner's keychain needs it beside the .p12, or the identity is not valid.
          MACOS_SIGN_CA_URL: https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          MACOS_SIGN_CA_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
        run: make dist-macos VERSION="${GITHUB_REF_NAME#v}"

      # The script deletes them itself; this covers a cancelled run.
      - name: Delete the signing keychain and the key files
        if: always()
        run: hack/macos/release.sh cleanup

      - name: Upload the macOS downloads
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/macos/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach to the release
    needs: [cli, macos-sign]
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 15
    permissions:
      contents: write  # upload the assets, append the note to the release's text
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Install make
        run: command -v make >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq make >/dev/null; }

      - name: Download the artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: make dist-checksums

      # Exactly the files the signing job's verdict promises: with the signature the disk image and
      # no app zip, without it the app zip and no disk image; cogpit-cli for six platforms either way.
      - name: Check the files and write the note
        id: files
        env:
          SIGNED: ${{ needs.macos-sign.outputs.signed }}
          IDENTITY: ${{ needs.macos-sign.outputs.identity }}
        run: |
          set -euo pipefail
          cd dist
          expect() {
            n="$(find . -maxdepth 1 -name "$1" | wc -l | tr -d ' ')"
            [ "${n}" = "$2" ] || { echo "::error::dist/$1: ${n} files, expected $2"; exit 1; }
          }
          expect 'cogpit-cli_*_linux_*.tar.gz' 2
          expect 'cogpit-cli_*_darwin_*.tar.gz' 2
          expect 'cogpit-cli_*_windows_*.zip' 2
          if [ "${SIGNED}" = true ]; then
            expect 'Cogpit-*-macos-*.dmg' 1
            expect 'Cogpit_*_darwin_*.zip' 0
          else
            expect 'Cogpit-*.dmg' 0
            expect 'Cogpit_*_darwin_*.zip' 1
          fi
          {
            echo 'list<<EOF'
            find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' -o -name SHA256SUMS \) | sed 's|^\./|dist/|' | sort
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

          note="${RUNNER_TEMP}/note.md"
          if [ "${SIGNED}" = true ]; then
            dmg="$(find . -maxdepth 1 -name 'Cogpit-*-macos-*.dmg' | sed 's|^\./||')"
            cat > "${note}" <<EOF

          ---

          **Downloads.** \`${dmg}\` is the app for macOS on Apple silicon: open it and drag Cogpit into Applications. \`cogpit-cli\` runs on Linux, macOS and Windows (amd64 and arm64). Check them against \`SHA256SUMS\` (\`sha256sum -c SHA256SUMS --ignore-missing\`).

          **Signed and notarized for macOS.** The app, the disk image and the macOS \`cogpit-cli\` are signed with the Developer ID "${IDENTITY}" and notarized by Apple. The disk image carries its ticket, so macOS opens it without a warning, offline too; \`cogpit-cli\` cannot carry one, so macOS looks its ticket up online the first time it runs. The Linux and Windows downloads and \`SHA256SUMS\` are not signed ([docs/security/updates.md](https://github.com/guided-traffic/cogpit/blob/main/docs/security/updates.md)). Desktop packages for Linux and Windows come with milestone M11; \`cogpit-cli\` runs there today.
          EOF
          else
            cat > "${note}" <<'EOF'

          ---

          **Downloads.** `cogpit-cli` for Linux, macOS and Windows (amd64 and arm64) and `Cogpit.app` for macOS on Apple silicon; check them against `SHA256SUMS` (`sha256sum -c SHA256SUMS --ignore-missing`).

          **Unsigned.** This build ran without the project's Apple signing material: neither the app nor the macOS `cogpit-cli` is signed with a Developer ID or notarized. macOS blocks the first start of a downloaded copy: allow it once in System Settings → Privacy & Security → Open Anyway ([docs/security/updates.md](https://github.com/guided-traffic/cogpit/blob/main/docs/security/updates.md)). Desktop packages for Linux and Windows come with milestone M11; `cogpit-cli` runs there today.
          EOF
          fi
          cat "${note}"

      - name: Attach the artifacts and the note
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.files.outputs.list }}
          fail_on_unmatched_files: true
          append_body: true
          body_path: ${{ runner.temp }}/note.md

  # Sparkle's appcast (D-4; docs/developer/releasing.md#the-appcast): the update feed at
  # https://guided-traffic.github.io/cogpit/appcast.xml, one feed with the releases' history, signed
  # with the update key. Three jobs, so that the key shares a job with nothing but Sparkle's own
  # sign_update: the draft (Go, no secret), the signature (the environment sparkle, no Go), and the
  # check and deploy (the public key, the environment github-pages). They run once the release's
  # files are attached, so the item never points at a missing download, and they cannot take the
  # files back: whatever happens here, the release keeps them.
  appcast-draft:
    name: Appcast (draft)
    needs: [macos-sign, publish]
    if: needs.macos-sign.outputs.signed == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      drafted: ${{ steps.draft.outputs.drafted }}
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: none
          fyne-deps: "false"

      - name: Download the macOS downloads
        uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: dist/macos

      # An app built without the update key (the variable unset) gets no item: drafted=false.
      - name: Draft the appcast
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: make appcast-draft VERSION="${GITHUB_REF_NAME#v}"

      - name: Upload the draft
        if: steps.draft.outputs.drafted == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: appcast-draft
          path: dist/appcast/
          if-no-files-found: error
          retention-days: 7

  # The only job in the environment `sparkle` (the owner its required reviewer, tags v* only), the
  # only one that sees SPARKLE_ED_PRIVATE_KEY. Without the key it signs nothing and nothing is
  # deployed, never a failure; with it, it refuses unless the environment has its reviewer and its
  # tag rule (GitHub creates a named environment without any), then signs the disk image and the
  # feed with sign_update from the pinned Sparkle archive. The key reaches sign_update on its
  # standard input only (hack/macos/appcast.sh).
  appcast-sign:
    name: Appcast (sign)
    needs: [appcast-draft]
    if: needs.appcast-draft.outputs.drafted == 'true'
    runs-on: macos-latest
    environment: sparkle
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # the environment's protection rules
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Download the macOS downloads
        uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: dist/macos

      - name: Download the draft
        uses: actions/download-artifact@v8
        with:
          name: appcast-draft
          path: dist/appcast

      - name: Sign the disk image and the appcast
        id: sign
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: make appcast-sign VERSION="${GITHUB_REF_NAME#v}"

      - name: Upload the signed appcast
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: appcast-signed
          path: dist/site/
          if-no-files-found: error
          retention-days: 7

      # The key was never written to a file; this removes the job's work files on any outcome.
      - name: Remove the work files
        if: always()
        run: rm -rf dist .cache/sparkle

  # Checked with the public key before Pages gets it: the feed's signature, every item, and that
  # the release's item names this disk image with a signature over its bytes. Then deployed: Pages
  # serves exactly this feed (source "GitHub Actions"). The environment github-pages needs a
  # deployment rule for tags v* (docs/developer/releasing.md#setting-up-sparkle).
  appcast-deploy:
    name: Appcast (deploy to Pages)
    needs: [appcast-sign]
    if: needs.appcast-sign.outputs.signed == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'self-hosted' }}
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}appcast.xml
    permissions:
      contents: read
      pages: write     # deploy to Pages
      id-token: write  # the deployment's OIDC token
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout the release's tag
        uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache: none
          fyne-deps: "false"

      - name: Install make
        run: command -v make >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq make >/dev/null; }

      - name: Download the macOS downloads
        uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: dist/macos

      - name: Download the draft
        uses: actions/download-artifact@v8
        with:
          name: appcast-draft
          path: dist/appcast

      - name: Download the signed appcast
        uses: actions/download-artifact@v8
        with:
          name: appcast-signed
          path: dist/site

      - name: Verify the signed appcast
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: make appcast-verify VERSION="${GITHUB_REF_NAME#v}"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
