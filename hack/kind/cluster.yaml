# kind cluster for local development and the MVP demo. `make kind-up` creates it with its own
# kubeconfig file (.cache/kind/kubeconfig); ~/.kube/config is never touched.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cogpit
networking:
  # The default service CIDR; the seed's demo Service uses the fixed ClusterIP 10.96.100.100.
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
