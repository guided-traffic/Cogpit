# The multi-node kind cluster of the cordon, uncordon and drain tests (`make kind-drain-up`,
# `make test-kind-drain`): one control plane and two workers, so that a worker can be cordoned and
# drained while the shared single-node cluster `cogpit` keeps running everyone else's tests. Its
# kubeconfig is its own file (.cache/kind-drain/kubeconfig); ~/.kube/config is never touched.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cogpit-drain
nodes:
  - role: control-plane
  - role: worker
  - role: worker
