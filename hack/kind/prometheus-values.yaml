# Values for the prometheus-community `prometheus` chart that `make kind-prometheus` installs into
# the kind cluster (namespace monitoring, release prometheus): the server alone, which is all
# Cogpit's metrics read (architecture §9). Its Service is monitoring/prometheus-server, port 80
# named "http", which Cogpit's detection finds by name. The chart's `kubernetes-nodes-cadvisor`
# job scrapes the kubelets' cAdvisor endpoint, the source of every query Cogpit sends; the scrape
# interval stays the chart's default (1m), the one users of the chart get.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
# Cogpit's queries need neither: requests and limits come from the pod spec, node charts from
# cAdvisor's root cgroup.
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
server:
  # A week of history on the developer's disk (local-path); the claim's size is not enforced there.
  retention: 7d
  persistentVolume:
    size: 2Gi
