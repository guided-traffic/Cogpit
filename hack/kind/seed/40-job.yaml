# migrate: a Job that runs once and completes, leaving a Completed pod behind. It has no TTL, so
# it stays for the demo; re-applying the unchanged manifest is a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: cogpit-demo
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: cogpit-demo
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: cogpit-demo
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: migrate
          image: busybox:1.37.0
          command: ["sh", "-c", "echo 'applying migrations'; sleep 3; echo 'done: 12 migrations applied'"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
