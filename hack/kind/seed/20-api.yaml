# api: two replicas of the Kubernetes e2e test server (agnhost netexec), an HTTP echo service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cogpit-demo
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: cogpit-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: cogpit-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: netexec
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cogpit-demo
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: cogpit-demo
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
